<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Drafter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Note Drafter</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <section>      
        <h2>Draft a note</h2>
        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          rows="6"
          placeholder="Start typing..."
        ></textarea>
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        <button id="clear-btn" type="button">Clear</button>
      </section>
    </main>
  </body>
</html>
